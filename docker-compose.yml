version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_tienda_pepe
    environment:
      MYSQL_DATABASE: db_tienda_pepe
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/dbtiendapepe.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: tiendapepe_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/db_tienda_pepe?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
    depends_on:
      - db
    restart: always

volumes:
  mysql_data: